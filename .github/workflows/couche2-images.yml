name: Couche 2 — lecture des emballages

# Declenchement MANUEL uniquement. Ce workflow appelle une API payante et lit
# des images sur un hote externe : il ne doit pas partir sur un push.
#
# Secret requis dans le depot : STUDY_API_KEY
# (Settings -> Secrets and variables -> Actions)
on:
  workflow_dispatch:
    inputs:
      etape:
        description: "preflight = 1 seul appel ; lot = lecture complete"
        required: true
        default: "preflight"
        type: choice
        options: ["preflight", "lot"]
      max_produits:
        description: "Nombre maximum de produits a lire (etape lot)"
        required: true
        default: "20"
      modele:
        description: "Modele (vide = celui de config/lecture_image.yaml)"
        required: false
        default: ""
      taille_image:
        description: "Resolution demandee a Open Food Facts"
        required: true
        default: "full"
        type: choice
        options: ["full", "800", "400"]

jobs:
  lecture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependances
        run: |
          pip install -r requirements.txt
          pip install openai

      - name: Espace disque
        run: df -h /

      # Le runner GitHub n'a pas les restrictions reseau de l'environnement de
      # developpement : il joint le dump Open Food Facts, images.openfoodfacts.org
      # et la passerelle du modele.
      - name: Couche 1 — dump, perimetre, assertions
        run: make couche1

      # Un seul appel. Verifie que la passerelle relaie bien l'image jusqu'au
      # modele : sans cette preuve, un lot complet produirait des lectures
      # inventees a partir du seul texte de la consigne.
      - name: Preflight
        env:
          STUDY_API_KEY: ${{ secrets.STUDY_API_KEY }}
        run: |
          if [ -z "$STUDY_API_KEY" ]; then
            echo "::error::secret STUDY_API_KEY absent du depot."
            exit 1
          fi
          python3 src/couche2_lecture_image.py --preflight \
            --taille "${{ inputs.taille_image }}" \
            ${{ inputs.modele && format('--modele {0}', inputs.modele) || '' }}

      - name: Lecture du lot
        if: inputs.etape == 'lot'
        env:
          STUDY_API_KEY: ${{ secrets.STUDY_API_KEY }}
        run: |
          python3 src/couche2_lecture_image.py --executer \
            --max "${{ inputs.max_produits }}" \
            --taille "${{ inputs.taille_image }}" \
            ${{ inputs.modele && format('--modele {0}', inputs.modele) || '' }}

      # Le taux d'erreur ne peut etre calcule que si un humain a rempli
      # donnees_humaines/double_codage.csv. Sans lui, la lecture reste
      # descriptive : on le dit, on n'echoue pas le job pour autant.
      - name: Taux d'erreur contre le double codage humain
        if: inputs.etape == 'lot'
        continue-on-error: true
        run: python3 src/couche2_validation.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couche2-lecture-images
          path: |
            sorties/couche2_lecture_image.csv
            sorties/couche2_taux_erreur.csv
            sorties/double_codage_a_remplir.csv
          if-no-files-found: warn
