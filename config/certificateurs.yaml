# Registre des certificateurs halal, par ORGANISME et non par tag.
#
# La taxonomie OFF eclate un meme organisme en variantes : prefixe fr:/en:,
# fautes de frappe, formulations differentes. Les regrouper est un travail
# manuel, celui que la couche 1 renvoyait a plus tard.
#
# Deux points de fond :
#  - la SFCVH (Societe Francaise de Controle de Viande Halal) EST l'organisme
#    de certification de la Grande Mosquee de Paris. Les tags qui nomment l'une
#    ou l'autre designent le meme certificateur et sont fusionnes.
#  - un certificateur se detecte par les donnees, jamais par la chaine 'halal'
#    dans le nom du tag : AVS s'appelle « A Votre Service ».
#
# Detection : label porte par au moins 2 produits dont 80 % ou plus sont
# tagues en:halal, puis regroupement manuel et nommage.

certificateurs:
  - nom: Mosquee d'Evry-Courcouronnes
    tags:
      - fr:controle-de-la-mosquee-d-evry-courcouronnes
      - en:controle-de-la-mosquee-d-evry-courcouronnes
      - fr:certification-mosquee-evry-courcouronnes
      - en:controledelamosqueedevrycourcouronnes
      - fr:controle-de-la-mosquee-d-evry-courcouonnes   # faute dans la base
      - fr:halal-mosquee-courcouronnes

  - nom: ARGML — Grande Mosquee de Lyon
    tags:
      - fr:association-rituelle-de-la-grande-mosquee-de-lyon
      - fr:controle-grande-mosquee-de-lyon-halal
      - fr:association-rituelle-de-la-grande-mosquee-de-lyonfr-association-rituelle-de-la-grande-mosquee-de-lyon

  - nom: AVS — A Votre Service
    tags:
      - fr:a-votre-service
      - fr:controle-certification-avs-halal
      - fr:organisme-de-controle-independant-avs-halal

  # La SFCVH est l'organisme de la Grande Mosquee de Paris : meme certificateur.
  - nom: SFCVH — Grande Mosquee de Paris
    tags:
      - fr:societe-francaise-de-controle-de-viande-halal
      - en:societe-francaise-de-controle-de-viande-halal
      - en:societe-francaise-de-controle-de-viande-halal-grande-mosquee-de-paris
      - fr:societe-francaise-de-controle-de-viande-halal-grande-mosquee-de-paris
      - fr:controle-mosquee-de-paris-halal

  - nom: Halal Food Council of Europe
    tags:
      - en:halal-food-council-of-europe
      - fr:food-concil-of-europe
      - fr:halal-food-concil-of-europe

  - nom: Achahada
    tags:
      - fr:achahada

  - nom: Halal Certification Germany
    tags:
      - fr:halal-certification-germany
      - fr:certification-germany

  - nom: Extra Kalite
    tags:
      - fr:extra-kalite
      - fr:controle-extra-kalite
      - en:halalcontrole-extra-kalite

# Corrections de saisie du codage humain, appliquees a l'ingestion.
# SECVH est une coquille pour SFCVH.
normalisation_saisie:
  SECVH: SFCVH — Grande Mosquee de Paris
  SFCVH: SFCVH — Grande Mosquee de Paris
  "Mosquée de Paris": SFCVH — Grande Mosquee de Paris
  "Grande Mosquée de Paris": SFCVH — Grande Mosquee de Paris
  AVS: AVS — A Votre Service
  ACHAHADA: Achahada
  Achahada: Achahada
  ARGML: ARGML — Grande Mosquee de Lyon
  "Mosquée d'Evry-Courcouronnes": Mosquee d'Evry-Courcouronnes
  "Mosquée d'Évry-Courcouronnes": Mosquee d'Evry-Courcouronnes
  "Halal Food Council of Europe": Halal Food Council of Europe
